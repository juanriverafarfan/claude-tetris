<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Tetris — Juego clásico</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1 class="game-title">TETRIS</h1>
      <div class="game-container">
        <div class="board-stack" id="board-stack">
          <canvas id="board" width="300" height="600"></canvas>
          <div id="fx-layer" class="fx-layer" aria-live="polite"></div>
        </div>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value mini" id="combo">x1</span>
          </div>

          <div class="panel-section">
            <span class="label">B2B TETRIS</span>
            <span class="value mini" id="b2b">OFF</span>
          </div>

          <div class="panel-section">
            <span class="label">SPECIAL NOW</span>
            <span class="value mini" id="special-current">NINGUNO</span>
          </div>

          <div class="panel-section">
            <span class="label">SPECIAL NEXT</span>
            <span class="value mini" id="special-next">NINGUNO</span>
          </div>

          <div class="panel-section">
            <span class="label">FREEZE</span>
            <span class="value mini" id="freeze">0.0s</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>

          <div class="panel-section highscores-panel">
            <span class="label">TOP 5 RÉCORDS</span>
            <ol id="highscores-list" class="highscores-list"></ol>
            <button id="reset-scores-btn" class="reset-scores-btn">
              Resetear récords
            </button>
          </div>
        </aside>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="highscore-entry" class="highscore-entry hidden">
            <label for="player-name-input"
              >¡Nueva puntuación en el top 5! Ingresa tu nombre:</label
            >
            <input
              type="text"
              id="player-name-input"
              maxlength="12"
              placeholder="Jugador"
              autocomplete="off"
            />
            <button id="save-score-btn">Guardar récord</button>
          </div>
          <ol id="overlay-highscores" class="highscores-list"></ol>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
